name: Store adapter conformance
description: Report or discuss a RunStore or ExecutionStore adapter issue.
title: "[Store]: "
labels:
  - store
  - roadmap
body:
  - type: input
    id: backend
    attributes:
      label: Backend and isolation level
      placeholder: PostgreSQL, serializable
    validations:
      required: true
  - type: dropdown
    id: port
    attributes:
      label: Store port
      options:
        - RunStore
        - ExecutionStore
        - Both
    validations:
      required: true
  - type: textarea
    id: conformance
    attributes:
      label: Failing conformance subtest
      description: Paste the test name and sanitized failure; do not paste application records.
    validations:
      required: true
  - type: textarea
    id: transaction
    attributes:
      label: Transaction and fencing mapping
      description: Explain callbacks, identities, leases, attempts, atomic commits, replay, and reconciliation.
    validations:
      required: true
