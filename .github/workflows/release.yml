name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
          cache: true
      - name: Verify tag and source version
        shell: bash
        run: |
          source_version=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' version.go)
          test -n "$source_version"
          test "$GITHUB_REF_NAME" = "v$source_version"
          test -f "api/$GITHUB_REF_NAME.txt"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - name: Verify current public API snapshot
        run: bash scripts/check-api-baseline.sh
      - name: Verify tagged public API snapshot
        env:
          API_BASELINE: "api/${{ github.ref_name }}.txt"
        run: bash scripts/check-api-baseline.sh
      - run: go test ./...
      - run: go vet ./...
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
